<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#1F2348">
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0F1126">
    <!--
        CSP changes from original:
        - Removed 'unsafe-eval' (WASM only needs 'wasm-unsafe-eval')
        - Removed https://cdn.jsdelivr.net from all directives (assets now self-hosted)
        - Added frame-src for keyguard iframe origin
        Replace [KEYGUARD_ORIGIN] before deploying, e.g. https://nimiq-wallet-keyguard.github.io

        connect-src is an EXPLICIT allowlist (no blanket https:) to preserve
        exfiltration protection. The four Polygon RPC endpoints and the GSN
        relay origin MUST stay in sync with POLYGON.rpcUrls /
        POLYGON.allowedRelayOrigins in src/config.js. Adding a relay or RPC =
        one line here + one line there.
    -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval' 'sha256-pJC4gS7fEJ2sD+197b4a+ot2JC9A5BR+IiRkBc7vMMk='; style-src 'self' 'unsafe-inline'; connect-src 'self' [KEYGUARD_ORIGIN] wss: https://polygon-bor-rpc.publicnode.com https://gateway.tenderly.co https://polygon.api.onfinality.io https://polygon.drpc.org https://gsn.main.fastspot.io; worker-src 'self' blob:; frame-src [KEYGUARD_ORIGIN]; img-src 'self' data:; form-action 'self'; base-uri 'self'; object-src 'none'">
    <title>Nimiq Wallet</title>
    <link rel="icon" href="public/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="src/styles/app.css">
    <!-- Security init MUST load before any other scripts -->
    <script src="src/security-init.js"></script>
</head>
<body class="nq-blue-bg">
    <!--
        Keyguard iframe is NOT static. It is created by JS (createKeyguardFrame
        in src/modules/keyguard-api.js) only AFTER the wallet's integrity gate
        (src/modules/keyguard-verify.js) has cross-verified the keyguard's
        served code against the hash-pinned manifest. A tampered or unreachable
        keyguard is therefore never attached. connect-src above allows the
        verifier to fetch the keyguard origin.
    -->
    <div id="app">
        <div class="loading-screen">
            <h1 class="nq-h1">Loading Nimiq...</h1>
            <p class="nq-text">Initializing wallet</p>
        </div>
    </div>
    <script type="importmap">
    {
        "imports": {
            "@nimiq/core": "./lib/nimiq-core/web/index.js"
        }
    }
    </script>
    <script type="module" src="src/main.js"></script>
</body>
</html>
