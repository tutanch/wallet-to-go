name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Replace origin placeholders
        run: |
          sed -i "s|\[KEYGUARD_ORIGIN\]|https://n-keyguard.github.io|g" index.html
          sed -i "s|\[KEYGUARD_ORIGIN\]|https://n-keyguard.github.io|g" src/modules/keyguard-api.js
          sed -i "s|\[KEYGUARD_ORIGIN\]|https://n-keyguard.github.io|g" src/modules/webauthn.js

      - name: Generate service worker with integrity hashes
        run: node scripts/generate-sw.js

      - run: touch .nojekyll

      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - uses: actions/deploy-pages@v4
        id: deployment
