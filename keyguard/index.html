<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#1F2348">
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0F1126">
    <!--
        Strict CSP for the keyguard:
        - connect-src 'none': keyguard never makes network requests
        - form-action 'none': no form submissions to external URLs
        - script-src hash: covers the inline importmap below
        NOTE: frame-ancestors cannot be enforced via <meta>; add it as an HTTP
        response header in your server/CDN config instead:
          Content-Security-Policy: frame-ancestors [WALLET_ORIGIN]
        e.g.  frame-ancestors https://tutanch.github.io
    -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'wasm-unsafe-eval' 'sha256-pJC4gS7fEJ2sD+197b4a+ot2JC9A5BR+IiRkBc7vMMk='; style-src 'self' 'unsafe-inline'; img-src 'self'; connect-src 'none'; worker-src 'self' blob:; form-action 'none'; base-uri 'self'; object-src 'none'">
    <title>Nimiq Keyguard</title>
    <link rel="icon" href="public/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="src/styles/keyguard.css">
    <!-- Security hardening MUST load before any other keyguard script -->
    <script src="src/keyguard-init.js"></script>
</head>
<body>
    <!-- All keyguard UI is rendered here by keyguard-app.js -->
    <div id="keyguard-ui" style="display:none;"></div>
    <script type="importmap">
    {
        "imports": {
            "@nimiq/core": "./lib/nimiq-core/web/index.js"
        }
    }
    </script>
    <script type="module" src="src/keyguard-app.js"></script>
</body>
</html>
